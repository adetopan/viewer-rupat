services:
  postgres:
    image: postgres:16-alpine
    container_name: rupat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rupat
      POSTGRES_PASSWORD: Jagakarsa28
      POSTGRES_DB: rupat
    ports:
      - "5432:5432"
    volumes:
      - rupat_pg_data:/var/lib/postgresql/data

volumes:
  rupat_pg_data:
